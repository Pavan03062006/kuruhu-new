[project]
name = "pramaan-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "alembic>=1.14,<2", "redis>=5,<6", "pyjwt[crypto]>=2.10,<3", "argon2-cffi>=23.1,<26", "httpx>=0.28,<1", "langgraph>=0.6,<2", "sqlglot>=27,<30"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "black>=24,<26", "isort>=5,<7", "mypy>=1.14,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
